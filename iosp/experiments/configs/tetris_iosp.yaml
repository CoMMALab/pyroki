experiment: tetris_iosp
module: iosp.experiments.e8_tetris
description: "IOSP on SPaSM tetris packing: recover trajopt costs from composed pick-place demos"

defaults:
  n_iters: 60
  n_steps: 40
  n_starts: 4

runs:
  - name: blocks3_seed0
    args: {num_blocks: 3, seed: 0}
    out: iosp/data/results/tetris/blocks3_seed0.npz
  - name: blocks3_seed1
    args: {num_blocks: 3, seed: 1}
    out: iosp/data/results/tetris/blocks3_seed1.npz
  - name: blocks3_seed2
    args: {num_blocks: 3, seed: 2}
    out: iosp/data/results/tetris/blocks3_seed2.npz
  - name: blocks5_seed0
    args: {num_blocks: 5, seed: 0}
    out: iosp/data/results/tetris/blocks5_seed0.npz
  - name: blocks5_seed1
    args: {num_blocks: 5, seed: 1}
    out: iosp/data/results/tetris/blocks5_seed1.npz
  - name: blocks5_seed2
    args: {num_blocks: 5, seed: 2}
    out: iosp/data/results/tetris/blocks5_seed2.npz

env:
  CUDA_VISIBLE_DEVICES: auto
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  # command buffers disabled: newer JAX/driver accumulates CUDA graphs
  # ("N alive graphs") until command-buffer instantiation OOMs the GPU during
  # demo generation; disabling them falls back to normal kernel launches.
  XLA_FLAGS: "--xla_disable_hlo_passes=fusion --xla_gpu_enable_command_buffer="
  PYTHONUNBUFFERED: "1"
